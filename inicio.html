<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div id="app">
  <!-- NAVBAR -->
<nav class="main-nav">
    <div class="nav-content">
        <div class="nav-logo">
            <img src="img/logo1.jpg" alt="Logo">
        </div>
        <div class="nav-menu">
            <a v-for="item in navItems" :key="item.label" :href="item.href">{{ item.label }}</a>
        </div>
    </div>
</nav>

    <section class="contenedor">
        <h1 class="titulo">{{ title }}</h1>


    <!-- CARRUSEL -->
<div id="bioCarousel" class="carousel slide custom-carousel" data-bs-ride="carousel">

    <!-- Indicadores -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#bioCarousel" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#bioCarousel" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#bioCarousel" data-bs-slide-to="2"></button>
    </div>

    <!-- Slides -->
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="img/ima.jpg" class="d-block w-100" alt="">
        </div>

        <div class="carousel-item">
            <img src="img/ima1.jpg" class="d-block w-100" alt="">
        </div>

        <div class="carousel-item">
            <img src="img/ima2.jpg" class="d-block w-100" alt="">
        </div>
    </div>

    <!-- Controles -->
    <button class="carousel-control-prev" type="button" data-bs-target="#bioCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#bioCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>
</div>
</section>
</div>

    <!-- Bootstrap JS -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
    const { createApp } = Vue;
    createApp({
        data() {
            return {
                title: 'BioConteo de Colonias Bacterianas',
                navItems: [
                    { href: 'inicio.html', label: 'Inicio' },
                    { href: 'login.html', label: 'Iniciar sesión' },
                    { href: 'servicios.html', label: 'Servicios' },
                    { href: 'contactanos.html', label: 'Contacto' }
                ]
            };
        }
    }).mount('#app');
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
